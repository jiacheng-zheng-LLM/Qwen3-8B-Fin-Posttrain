# Nginx OpenAI 兼容网关:3 副本负载均衡 + 健康剔除 + 指标透传
# 单 worker:多 worker 各自独立的轮询计数器都从 r1 起,低流量下会全部集中到 r1;
# LLM 网关 I/O 密集、吞吐受限于后端推理,单 worker 足以支撑大量长连接。
worker_processes 1;
events { worker_connections 4096; }
http {
    # 上游:3 个 vLLM 副本(容器内互通用服务名)。用加权 round-robin(nginx 默认算法)。
    # round-robin:每请求确定性轮换下一副本,串行/并发都均匀,分发可断言(N 请求应精确均分)。
    # 为何不用 least_conn:长请求场景理论更贴合,但 vLLM 连续批处理下"活跃连接数"只是粗糙
    # 负载代理(未饱和副本挂更多在途请求反而更快),且低流量下分布本就不均、无法验证均衡正确性;
    # 真要做负载感知路由应按 vllm:num_requests_waiting / KV 占用反馈,已超出 nginx 内置算法。
    # 不用 upstream keepalive:长连接池复用会让请求集中到单副本;LLM 请求本身长,
    # 每请求新建上游连接开销可忽略,换来干净分发与故障切换。
    # 灰度发布(加权):稳定版 r1/r2 各 weight=4,金丝雀 r3 weight=1(≈11% 流量)。
    # r3 兼作 TP1 慢副本降权,缓解异构 straggler。验证无恙后把 r3 提到 weight=4 全量。
    upstream vllm_backend {
        server vllm-r1:8000 weight=4 max_fails=3 fail_timeout=30s;  # 稳定版 current
        server vllm-r2:8000 weight=4 max_fails=3 fail_timeout=30s;  # 稳定版 current
        server vllm-r3:8000 weight=4 max_fails=3 fail_timeout=30s;  # 金丝雀 canary
    }
    # 推理是长请求:超时给足,防长思维链被网关掐断
    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    server {
        listen 4000;

        # OpenAI 兼容推理:/v1/chat/completions 等
        location /v1/ {
            proxy_pass http://vllm_backend;
            # 故障副本自动切下一个(高可用)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
        # 网关自身存活
        location /health {
            access_log off;
            return 200 "gateway-ok\n";
        }
        # 透传某副本指标(监控用;生产由 Prometheus 直抓各副本)
        location /metrics { proxy_pass http://vllm_backend/metrics; }
    }
}
